# Include at server scope from the existing doneat-cn static configuration.
# No root, TLS, DNS or add_header overrides: inherit the site's existing headers.
location = /android {
    alias /var/www/doneat-cn/android-current/index.html;
    default_type text/html;
}
location = /android/buy {
    alias /var/www/doneat-cn/android-current/buy/index.html;
    default_type text/html;
}
location = /android/faq {
    alias /var/www/doneat-cn/android-current/faq/index.html;
    default_type text/html;
}
location = /android/privacy {
    alias /var/www/doneat-cn/android-current/privacy/index.html;
    default_type text/html;
}
location = /android/refunds {
    alias /var/www/doneat-cn/android-current/refunds/index.html;
    default_type text/html;
}
location = /android/ {
    return 308 /android$is_args$args;
}
location ^~ /android/assets/ {
    alias /var/www/doneat-cn/android-current/assets/;
}
location /android/ {
    return 404;
}
