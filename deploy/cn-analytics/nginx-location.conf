# Include inside only the doneat.com.cn HTTPS server.
location = /api/cn-events {
    limit_except POST { deny all; }
    client_max_body_size 64;
    client_body_buffer_size 1k;
    client_body_timeout 5s;
    limit_req zone=doneat_cn_events burst=40 nodelay;
    limit_req_status 429;
    access_log off;
    # Do not persist rejected beacon request lines/referrers in the error log.
    error_log /dev/null;
    proxy_pass http://127.0.0.1:18092;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Origin $http_origin;
    proxy_set_header Content-Type text/plain;
    proxy_set_header Content-Length $content_length;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    add_header Cache-Control 'no-store' always;
    add_header X-Content-Type-Options nosniff always;
}
