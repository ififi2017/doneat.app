# Activate only after BOTH certificate files exist and nginx -t succeeds.
# Replaces the enabled bootstrap site; do not enable both at once.
server {
    listen 80;
    listen [::]:80;
    server_name doneat.com.cn www.doneat.com.cn;
    server_tokens off;

    # webroot HTTP-01 must be served before the domain HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control 'no-store' always;
    }
    location / {
        return 308 https://doneat.com.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 47.108.65.173;
    include /etc/nginx/snippets/doneat-cn-static.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.doneat.com.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/doneat.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doneat.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DoneAtChinaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    return 308 https://doneat.com.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doneat.com.cn;
    ssl_certificate /etc/letsencrypt/live/doneat.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doneat.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DoneAtChinaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/doneat-cn-static.conf;
}
