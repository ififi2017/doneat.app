# Shared server-scope static rules for China HTTPS and IP HTTP.
# Install root-owned as /etc/nginx/snippets/doneat-cn-static.conf.
root /var/www/doneat-cn/current;
index index.html;
autoindex off;
server_tokens off;
absolute_redirect off;
charset utf-8;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control 'no-cache' always;
access_log /var/log/nginx/doneat-cn.access.log;
error_log /var/log/nginx/doneat-cn.error.log;

error_page 404 /404.html;
location = /404.html {
    internal;
    try_files /404.html =404;
}
location = / { return 302 /zh-CN$is_args$args; }
location ~ ^/(download|about|faq|privacy|how-it-works)/?$ {
    return 302 /zh-CN/$1$is_args$args;
}
location = /sitemap.xml { return 301 /sitemap-index.xml$is_args$args; }

# Astro's static output has an index.html inside each published route.
location ~ ^/zh-CN(?:/(download|about|faq|privacy|how-it-works))?/?$ {
    try_files $uri/index.html =404;
}
# Hidden files and implementation metadata are never public.
location ~ (?:^|/)\. { return 404; }
location ~ ^/_astro/[A-Za-z0-9_./-]+\.(?:css|js|mjs|woff2?|png|jpe?g|webp|avif|svg)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control 'public, max-age=31536000, immutable';
}
location ~ ^/(?:device|desktop-demo|icons|brand|badges)/[A-Za-z0-9_./-]+\.(?:png|jpe?g|webp|avif|svg|ico|mp4)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control 'public, max-age=3600, must-revalidate';
    # Standard nginx static serving supports byte-range requests for MP4.
}
location ~ ^/fonts/[A-Za-z0-9_-]+\.woff2?$ {
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control 'public, max-age=3600, must-revalidate';
}
location ~ ^/licenses/[A-Za-z0-9_.-]+\.txt$ { try_files $uri =404; }
location = /favicon.ico { try_files $uri =404; }
location = /favicon.svg { try_files $uri =404; }
location = /robots.txt { try_files $uri =404; }
location ~ ^/sitemap-(?:index|[0-9]+)\.xml$ { try_files $uri =404; }
# No SPA fallback, arbitrary HTML, manifests, scripts, or directory listing.
location / { return 404; }
